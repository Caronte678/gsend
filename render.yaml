# GSend — configuración de despliegue para Render
#
# En Render: New → Blueprint → conectá este repositorio.
# Render lee este archivo y crea el servicio con todo configurado.
#
# Después solo hay que cargar a mano DATABASE_URL (la cadena de Neon),
# porque es la única que no se puede generar automáticamente.

services:
  - type: web
    name: gsend
    runtime: node
    plan: free
    # Debe coincidir con la region de Neon: la app hace varias consultas por
    # pantalla y cruzar EEUU en cada una agrega cientos de milisegundos.
    # Ojo: Render no permite cambiar la region despues de crear el servicio.
    region: ohio
    rootDir: backend

    # --include=dev es obligatorio: NODE_ENV=production le dice a npm que
    # omita las devDependencies, y ahi viven vite (compila el frontend) y el
    # CLI de prisma (corre las migraciones). Sin esto el build falla.
    #
    # install → genera el cliente Prisma (postinstall)
    # build   → compila el frontend que despues sirve Express
    # migrate → aplica las migraciones a la base
    buildCommand: npm install --include=dev && npm run build && npx prisma migrate deploy
    startCommand: npm start

    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production

      # Render genera un secreto aleatorio y seguro la primera vez.
      - key: JWT_SECRET
        generateValue: true

      - key: JWT_EXPIRES_IN
        value: 8h

      # Se carga a mano desde el panel: la cadena de conexión de Neon.
      # Acordate del ?sslmode=require al final.
      - key: DATABASE_URL
        sync: false
